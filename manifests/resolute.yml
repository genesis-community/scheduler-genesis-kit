---
# Ubuntu resolute stemcell.
#
# Loaded last by the resolute feature so that it wins over the ubuntu-noble
# default.  The stemcell version still comes from params.stemcell_version.
#
# The ocf-scheduler release pinned in releases/scheduler.yml calls chpst from
# a ctl script that does not run under bpm, and resolute does not ship chpst.
# Releases from 2.1.0 on no longer call it, and spruce merges this entry over the pin
# by name.

params:
  stemcell_os: ubuntu-resolute

releases:
- name:    ocf-scheduler
  version: 2.3.0
  url:     https://github.com/cloudfoundry-community/ocf-scheduler-boshrelease/releases/download/v2.3.0/ocf-scheduler-2.3.0.tgz
  sha1:    d9db486e8c5078dffccd676099f2d2d7513332e4
