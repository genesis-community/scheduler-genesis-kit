exodus:
  bosh: base
  cf_deployment_env: base
  cf_deployment_type: cf
  features: ""
  iaas: null
  is_director: false
  scale: null
  services: null
  use_create_env: false
instance_groups:
- azs:
  - z1
  instances: 1
  jobs:
  - consumes:
      postgres:
        from: scheduler-postgres
    name: scheduler
    properties:
      scheduler:
        cf:
          api: https://api.sys.example.com
        log_level: info
        postgres:
          uri: postgres://scheduler:scheduler@127.0.0.1:5432/scheduler?sslmode=disable
        uaa:
          client_id: app_scheduler
          client_secret: not-a-real-secret
          endpoint: https://uaa.sys.example.com
        workers: 10
    release: ocf-scheduler
  - name: postgres
    properties:
      databases:
        databases:
        - name: scheduler
        port: "5432"
        roles:
        - name: scheduler
          password: scheduler
    provides:
      postgres:
        as: scheduler-postgres
    release: postgres
  name: scheduler
  networks:
  - name: default
  persistent_disk_type: default
  stemcell: default
  vm_type: default
- azs:
  - z1
  instances: 1
  jobs:
  - name: smoke-tests
    properties:
      cf:
        api: https://api.sys.example.com
        organization: system
        password: not-a-real-password
        space: system
        username: admin
    release: ocf-scheduler
  lifecycle: errand
  name: smoke-tests
  networks:
  - name: default
  stemcell: default
  vm_type: errand
name: base-scheduler
releases:
- name: ocf-scheduler
  sha1: 524d6a1074c3097e2fa5cbf35b416608529b3f49
  url: https://github.com/cloudfoundry-community/ocf-scheduler-boshrelease/releases/download/v2.1.1/ocf-scheduler-2.1.1.tgz
  version: 2.1.1
- name: postgres
  sha1: 84ca2cd0773d2bcb92872773a330a5c087d9eebb
  url: https://bosh.io/d/github.com/cloudfoundry/postgres-release?v=51
  version: "51"
stemcells:
- alias: default
  os: ubuntu-noble
  version: latest
update:
  canaries: 1
  canary_watch_time: 5000-600000
  max_errors: 1
  max_in_flight: 1
  serial: false
  update_watch_time: 5000-600000
