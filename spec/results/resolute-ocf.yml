addons:
- include:
    jobs:
    - name: route_registrar
      release: routing
  jobs:
  - name: bosh-dns-aliases
    properties:
      aliases:
      - domain: nats.service.cf.internal
        targets:
        - deployment: resolute-ocf-cf
          domain: bosh
          instance_group: nats
          network: resolute-ocf.scheduler.net-scheduler
          query: '*'
      - domain: _.nats.service.cf.internal
        targets:
        - deployment: resolute-ocf-cf
          domain: bosh
          instance_group: nats
          network: resolute-ocf.scheduler.net-scheduler
          query: _
    release: bosh-dns-aliases
  name: bosh-dns-aliases
exodus:
  bosh: proto-main
  cf_deployment_env: resolute-ocf
  cf_deployment_type: cf
  features: ocfp,resolute
  iaas: aws
  is_director: false
  scale: null
  services: null
  use_create_env: false
instance_groups:
- azs:
  - resolute-ocf-z1
  - resolute-ocf-z2
  - resolute-ocf-z3
  instances: 1
  jobs:
  - name: scheduler
    properties:
      scheduler:
        cf:
          api: https://api.sys.example.com
        log_level: info
        postgres:
          uri: postgres://scheduler:not-a-real-password@db.example.com:5432/scheduler?sslmode=disable
        uaa:
          client_id: app_scheduler
          client_secret: not-a-real-secret
          endpoint: https://uaa.sys.example.com
        workers: 10
    release: ocf-scheduler
  - consumes:
      nats-tls:
        deployment: resolute-ocf-cf
        from: nats-tls
    name: route_registrar
    properties:
      nats:
        tls:
          client_cert: not-a-real-cert
          client_key: not-a-real-key
          enabled: true
      route_registrar:
        host: sys.example.com
        routes:
        - name: scheduler
          port: 8000
          registration_interval: 10s
          uris:
          - scheduler.sys.example.com
    release: routing
  - name: bpm
    release: bpm
  name: scheduler
  networks:
  - name: resolute-ocf.scheduler.net-scheduler
  stemcell: default
  vm_type: resolute-ocf.scheduler.vm-scheduler
- azs:
  - resolute-ocf-z1
  - resolute-ocf-z2
  - resolute-ocf-z3
  instances: 1
  jobs:
  - name: smoke-tests
    properties:
      cf:
        api: https://api.sys.example.com
        organization: system
        password: not-a-real-password
        space: system
        username: admin
    release: ocf-scheduler
  lifecycle: errand
  name: smoke-tests
  networks:
  - name: resolute-ocf.scheduler.net-scheduler
  stemcell: default
  vm_type: resolute-ocf.scheduler.vm-smoke-test
name: resolute-ocf-scheduler
releases:
- name: ocf-scheduler
  sha1: 2296cf509b80572761a20774354a6efc5d8e77b6
  url: https://github.com/cloudfoundry-community/ocf-scheduler-boshrelease/releases/download/v2.3.1/ocf-scheduler-2.3.1.tgz
  version: 2.3.1
- name: routing
  sha1: sha256:1409f3a0e56d89683f50c2d6c0fcb38d1a297c3710b3c067fb75182e7a7df356
  url: https://bosh.io/d/github.com/cloudfoundry/routing-release?v=0.343.0
  version: 0.343.0
- name: bpm
  sha1: sha256:7b445508d63d2171d892ba33f836087e1e519b9782f44c5fa5290323616ca8e6
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.41
  version: 1.4.41
- name: bosh-dns-aliases
  sha1: 55b3dced813ff9ed92a05cda02156e4b5604b273
  url: https://bosh.io/d/github.com/cloudfoundry/bosh-dns-aliases-release?v=0.0.4
  version: 0.0.4
stemcells:
- alias: default
  os: ubuntu-resolute
  version: "0.184"
update:
  canaries: 1
  canary_watch_time: 5000-600000
  max_errors: 1
  max_in_flight: 1
  serial: false
  update_watch_time: 5000-600000
