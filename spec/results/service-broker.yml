addons:
- include:
    jobs:
    - name: route_registrar
      release: routing
  jobs:
  - name: bosh-dns-aliases
    properties:
      aliases:
      - domain: nats.service.cf.internal
        targets:
        - deployment: service-broker-cf
          domain: bosh
          instance_group: nats
          network: default
          query: '*'
      - domain: _.nats.service.cf.internal
        targets:
        - deployment: service-broker-cf
          domain: bosh
          instance_group: nats
          network: default
          query: _
    release: bosh-dns-aliases
  name: bosh-dns-aliases
exodus:
  bosh: service-broker
  broker_name: scheduler
  broker_password: <!{meta.vault}/broker:password!>
  broker_url: https://scheduler.sys.example.com
  broker_username: scheduler-broker
  cf_deployment_env: service-broker
  cf_deployment_type: cf
  features: cf-route-registrar,service-broker
  iaas: null
  is_director: false
  scale: null
  service_name: scheduler
  services: null
  use_create_env: false
instance_groups:
- azs:
  - z1
  instances: 1
  jobs:
  - consumes:
      postgres:
        from: scheduler-postgres
    name: scheduler
    properties:
      scheduler:
        broker:
          api_url: https://scheduler.sys.example.com
          enabled: true
          password: <!{meta.vault}/broker:password!>
          require_binding: true
          username: scheduler-broker
        cf:
          api: https://api.sys.example.com
        log_level: info
        postgres:
          uri: postgres://scheduler:scheduler@127.0.0.1:5432/scheduler?sslmode=disable
        uaa:
          client_id: app_scheduler
          client_secret: not-a-real-secret
          endpoint: https://uaa.sys.example.com
        workers: 10
    release: ocf-scheduler
  - name: postgres
    properties:
      databases:
        databases:
        - name: scheduler
        port: "5432"
        roles:
        - name: scheduler
          password: scheduler
    provides:
      postgres:
        as: scheduler-postgres
    release: postgres
  - consumes:
      nats-tls:
        deployment: service-broker-cf
        from: nats-tls
    name: route_registrar
    properties:
      nats:
        tls:
          client_cert: not-a-real-cert
          client_key: not-a-real-key
          enabled: true
      route_registrar:
        host: sys.example.com
        routes:
        - name: scheduler
          port: 8000
          registration_interval: 10s
          uris:
          - scheduler.sys.example.com
    release: routing
  - name: bpm
    release: bpm
  name: scheduler
  networks:
  - name: default
  persistent_disk_type: default
  stemcell: default
  vm_type: default
- azs:
  - z1
  instances: 1
  jobs:
  - name: smoke-tests
    properties:
      cf:
        api: https://api.sys.example.com
        organization: system
        password: not-a-real-password
        space: system
        username: admin
    release: ocf-scheduler
  lifecycle: errand
  name: smoke-tests
  networks:
  - name: default
  stemcell: default
  vm_type: errand
name: service-broker-scheduler
releases:
- name: ocf-scheduler
  sha1: d9db486e8c5078dffccd676099f2d2d7513332e4
  url: https://github.com/cloudfoundry-community/ocf-scheduler-boshrelease/releases/download/v2.3.0/ocf-scheduler-2.3.0.tgz
  version: 2.3.0
- name: routing
  sha1: sha256:1409f3a0e56d89683f50c2d6c0fcb38d1a297c3710b3c067fb75182e7a7df356
  url: https://bosh.io/d/github.com/cloudfoundry/routing-release?v=0.343.0
  version: 0.343.0
- name: bpm
  sha1: sha256:40af85114d2a8a67812bf65212076581ea42cefcf67ee6b8d78d778ed1ca2b85
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.26
  version: 1.4.26
- name: bosh-dns-aliases
  sha1: 55b3dced813ff9ed92a05cda02156e4b5604b273
  url: https://bosh.io/d/github.com/cloudfoundry/bosh-dns-aliases-release?v=0.0.4
